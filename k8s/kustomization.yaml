apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: watchlist-roulette

# The Secrets (watchlist-db, watchlist-tmdb) are not here: deploy.sh creates them so no password is in git.
# postgres-init-scripts.yaml is generated by generate-init-scripts.sh from backend/migrations.
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres-init-scripts.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - network-policy.yaml
  - ingress.yaml

# `labels` without selectors: a Deployment's selector is immutable, so extra labels in it would break later applies.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: watchlist-roulette
