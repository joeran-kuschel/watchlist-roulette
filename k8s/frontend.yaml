apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # the tag is replaced with the freshly built one by deploy.sh
          image: watchlist-frontend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            # nginx looks the backend up by its full name (its resolver does not use the namespace search path)
            - name: BACKEND_URL
              value: http://backend.watchlist-roulette.svc.cluster.local:3000
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  # reached through the Ingress, not published on the host
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: frontend
