# Served at http://watchlist.local through the nginx ingress controller that Docker Desktop publishes on
# localhost:80 (shared with the other apps on this cluster). Everything goes to the frontend, whose nginx forwards
# /api and /health to the backend: the backend has no route of its own here, and network-policy.yaml lets only the
# frontend pods reach it. The name needs "127.0.0.1" and "::1" lines in
# /etc/hosts; deploy.sh prints them if they are missing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: watchlist-roulette
  annotations:
    # The controller allows 1 MB per request by default, which would answer a CSV upload with 413 before it
    # reaches the app. Set on this Ingress only (the controller is shared). Above the backend's 5 MB limit.
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
spec:
  ingressClassName: nginx
  rules:
    - host: watchlist.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
